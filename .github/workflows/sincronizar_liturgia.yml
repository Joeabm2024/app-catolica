name: Sincronizar liturgia diaria

on:
  schedule:
    - cron: "5 6 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sincronizar-liturgia-diaria
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Sincronizar lectura del día
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt

      - name: Preparar credencial de Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "Falta el secreto FIREBASE_SERVICE_ACCOUNT_BASE64"
            exit 1
          fi

          echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" |
            base64 --decode \
              > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Sincronizar liturgia de hoy
        env:
          CATHOPLE_API_KEY: ${{ secrets.CATHOPLE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ runner.temp }}/firebase-service-account.json
        run: python scripts/sincronizar_liturgia_hoy.py
